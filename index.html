<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HackConnect Practice</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #35ff65;
    font-family: monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    width: 95%;
    max-width: 900px;
    padding: 20px;
}

.title {
    border: 2px solid #35ff65;
    padding: 15px;
    text-align: center;
    font-size: 25px;
    margin-bottom: 15px;
    text-shadow: 0 0 10px #35ff65;
}

.target {
    border: 2px solid #35ff65;
    padding: 15px;
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
    letter-spacing: 5px;
}

.board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.column {
    border: 2px solid #35ff65;
    padding: 5px;
}

.number {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    border-bottom: 1px solid #075e25;
    cursor: pointer;
}

.number:hover,
.number:active {
    background: #35ff65;
    color: black;
}

.selected {
    background: #35ff65;
    color: black;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 15px;
}

button {
    background: #001b08;
    color: #35ff65;
    border: 2px solid #35ff65;
    padding: 12px 18px;
    font-family: monospace;
    font-size: 16px;
}

button:active {
    background: #35ff65;
    color: black;
}

#message {
    text-align: center;
    margin-top: 15px;
    min-height: 25px;
}

.success {
    color: white;
    text-shadow: 0 0 10px white;
}

@media(max-width:600px) {

    .title {
        font-size: 19px;
    }

    .target {
        font-size: 21px;
    }

    .number {
        height: 45px;
        font-size: 21px;
    }

    .board {
        gap: 4px;
    }

}
</style>
</head>

<body>

<div id="game">

<div class="title">
HACKCONNECT.EXE
</div>

<div class="target">
TARGET IP:
<span id="target">000.000.000.000</span>
</div>

<div class="board" id="board"></div>

<div class="controls">
<button onclick="newGame()">NEW HACK</button>
</div>

<div id="message">
FIND THE FOUR TARGET NUMBERS
</div>

</div>

<script>

let target = [];
let found = [false, false, false, false];

function randomNumber() {
    return Math.floor(Math.random() * 10);
}

function newGame() {

    target = [
        randomNumber(),
        randomNumber(),
        randomNumber(),
        randomNumber()
    ];

    found = [false, false, false, false];

    document.getElementById("target").textContent =
        target.join(".");

    document.getElementById("message").textContent =
        "FIND THE FOUR TARGET NUMBERS";

    document.getElementById("message").className = "";

    const board = document.getElementById("board");

    board.innerHTML = "";

    for (let column = 0; column < 4; column++) {

        const col = document.createElement("div");

        col.className = "column";

        /*
        Each column contains the target number
        somewhere inside it.
        */

        let targetPosition =
            Math.floor(Math.random() * 8) + 1;

        for (let row = 0; row < 10; row++) {

            const number =
                document.createElement("div");

            number.className = "number";

            let value =
                randomNumber();

            if (row === targetPosition) {
                value = target[column];
            }

            number.textContent = value;

            number.onclick = function() {

                if (found[column]) {
                    return;
                }

                if (value === target[column]) {

                    found[column] = true;

                    number.classList.add("selected");

                    document.getElementById("message")
                        .textContent =
                        "NODE " +
                        (column + 1) +
                        " CONNECTED";

                    if (found.every(Boolean)) {

                        document.getElementById("message")
                            .textContent =
                            "ACCESS GRANTED — CONNECTION ESTABLISHED";

                        document.getElementById("message")
                            .className = "success";
                    }

                } else {

                    document.getElementById("message")
                        .textContent =
                        "WRONG NODE";

                }

            };

            col.appendChild(number);
        }

        board.appendChild(col);
    }
}

newGame();

</script>

</body>
</html>
